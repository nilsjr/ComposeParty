[versions]
accompanist = "0.36.0"
androidPlugin = "8.12.0-rc01"
androidx-activity-compose = "1.12.0-alpha04"
androidx-compose = "2025.07.00"
androidx-compose-material3 = "1.4.0-alpha18"
androidx-media = "1.8.0-rc01"
barcodeScanning = "17.3.0"
camera = "1.5.0-beta02"
composeConstraintLayout = "1.1.1"
glm = "0.9.9.1-11"
gradleVersions = "0.52.0"
haze = "1.6.8"
kotlin = "2.2.20-Beta1"

[libraries]
accompanist-placeholder-material = { module = "com.google.accompanist:accompanist-placeholder-material3", version.ref = "accompanist" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-mlkit-vision = { module = "androidx.camera:camera-mlkit-vision", version.ref = "camera" }
androidx-compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "androidx-compose" }
androidx-compose-constraint = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "composeConstraintLayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.16.0" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.9.2" }
androidx-media-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media" }
androidx-media-ui = { module = "androidx.media3:media3-ui", version.ref = "androidx-media" }
androidx-splashscreen = "androidx.core:core-splashscreen:1.2.0-rc01"
barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcodeScanning" }
captureable = "dev.shreyaspatil:capturable:3.0.1"
coil-compose = "io.coil-kt:coil-compose:2.7.0"
graphics-glm = { module = "kotlin.graphics:glm", version.ref = "glm" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
konfetti = "nl.dionsegijn:konfetti-compose:2.1.0-beta01"
lottie-compose = "com.airbnb.android:lottie-compose:6.6.7"
physics-layout = "io.github.klassenkonstantin:physics-layout:0.4.1"
timber = "com.jakewharton.timber:timber:5.0.1"
zoomable = "net.engawapg.lib:zoomable:2.8.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidPlugin" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "gradleVersions" }
kotlin-androidGradle = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }